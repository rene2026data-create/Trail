<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 動物叫聲挑戰</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;min-height:100vh;padding:1.5rem 1rem 3rem}
  .wrap{max-width:700px;margin:0 auto}
  h1{font-size:26px;font-weight:600;color:#1a1a1a;margin-bottom:6px}
  .sub{font-size:15px;color:#666;margin-bottom:1.5rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px;margin-bottom:1.5rem}
  .card{background:#fff;border:2px solid #e5e5e5;border-radius:14px;padding:12px 8px;cursor:pointer;text-align:center;transition:border-color .2s,transform .15s,box-shadow .15s;user-select:none}
  .card:hover{border-color:#ccc;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .card.sel{border-color:#7F77DD;background:#f5f4ff}
  .card.ok{border-color:#1D9E75;background:#f0faf5}
  .card.no{border-color:#E24B4A;background:#fff5f5}
  .em{font-size:36px;line-height:1.2;display:block;margin-bottom:5px}
  .nm{font-size:13px;font-weight:600;color:#222}
  .ht{font-size:11px;color:#999;margin-top:2px}
  .panel{background:#fff;border-radius:16px;padding:1.4rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .ph{color:#aaa;font-size:14px;text-align:center;padding:1.5rem 0}
  .irow{display:flex;align-items:center;gap:14px;margin-bottom:1.1rem}
  .bem{font-size:52px;line-height:1}
  .det h2{font-size:20px;font-weight:600;color:#1a1a1a}
  .det p{font-size:13px;color:#777;margin-top:3px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tag{background:#f0f0f0;border-radius:20px;padding:3px 10px;font-size:12px;color:#555}
  .pbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:10px;border:1.5px solid #e0e0e0;background:#fafafa;color:#333;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:1rem;transition:background .15s,border-color .15s}
  .pbtn:hover{background:#f0efff;border-color:#7F77DD}
  .pbtn.playing{background:#f0efff;border-color:#7F77DD;color:#3C3489}
  .dvd{height:1px;background:#f0f0f0;margin:.9rem 0}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{padding:6px 16px;border-radius:20px;font-size:13px;cursor:pointer;border:1.5px solid #e0e0e0;background:#fff;color:#666;font-weight:500;transition:background .15s}
  .tab.on{background:#f0efff;border-color:#7F77DD;color:#3C3489}
  .ta{display:flex;flex-direction:column;gap:10px}
  .ti{width:100%;padding:10px 14px;font-size:15px;border:1.5px solid #e0e0e0;border-radius:10px;background:#fafafa;color:#1a1a1a;outline:none;transition:border-color .15s}
  .ti:focus{border-color:#7F77DD}
  .sb{padding:10px 22px;border-radius:10px;border:1.5px solid #e0e0e0;background:#fff;color:#333;font-size:14px;font-weight:600;cursor:pointer}
  .sb:hover{background:#f5f5f5}
  .va{display:flex;flex-direction:column;align-items:center;gap:12px;padding:.5rem 0}
  .mb{width:72px;height:72px;border-radius:50%;border:2px solid #e0e0e0;background:#fff;cursor:pointer;font-size:28px;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .1s}
  .mb:hover{transform:scale(1.06);background:#f5f5f5}
  .mb.rec{background:#fff5f5;border-color:#E24B4A;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
  .ms{font-size:13px;color:#888;text-align:center}
  .res{border-radius:12px;padding:14px 16px;margin-top:.9rem;display:none}
  .res.show{display:block}
  .rp{background:#f0faf5;border:1.5px solid #9bd4bf}
  .rf{background:#fff5f5;border:1.5px solid #f0b0b0}
  .ri{font-size:32px;display:block;text-align:center;margin-bottom:5px}
  .rt{font-size:15px;color:#1a1a1a;text-align:center;font-weight:600}
  .rs{font-size:12px;color:#777;text-align:center;margin-top:4px}
  .bw{height:8px;background:#e8e8e8;border-radius:4px;overflow:hidden;margin:10px 0 6px}
  .br{height:100%;border-radius:4px;transition:width .5s ease}
  .bl{font-size:11px;color:#888;text-align:right}
  .tip{font-size:12px;color:#bbb;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐾 動物叫聲挑戰</h1>
  <p class="sub">選動物 → 按 🔊 聽叫聲 → 輸入或錄音作答，相似度 80% 以上算答對！</p>
  <div class="grid" id="grid"></div>
  <div class="panel" id="panel"><div class="ph">👆 選一個動物開始挑戰</div></div>
</div>

};

const animals=[
  {id:'dog',    name:'狗',   emoji:'🐶',hint:'汪汪',   sounds:['汪汪','旺旺','woof','bow wow','汪','bark']},
  {id:'cat',    name:'貓',   emoji:'🐱',hint:'喵喵',   sounds:['喵喵','喵','meow','miao','mew','nyaa']},
  {id:'cow',    name:'牛',   emoji:'🐮',hint:'哞哞',   sounds:['哞','哞哞','moo','mo']},
  {id:'pig',    name:'豬',   emoji:'🐷',hint:'呼嚕',   sounds:['呼嚕','嗯嗯','oink','噜噜']},
  {id:'duck',   name:'鴨',   emoji:'🦆',hint:'呱呱',   sounds:['呱呱','呱','quack','嘎嘎','嘎']},
  {id:'frog',   name:'青蛙', emoji:'🐸',hint:'呱呱',   sounds:['呱呱','呱','croak','ribbit','瓜瓜']},
  {id:'sheep',  name:'羊',   emoji:'🐑',hint:'咩咩',   sounds:['咩咩','咩','baa','meh']},
  {id:'rooster',name:'公雞', emoji:'🐓',hint:'喔喔喔', sounds:['喔喔','咕咕','cock','喔']},
  {id:'horse',  name:'馬',   emoji:'🐴',hint:'嘶嘶',   sounds:['嘶嘶','咴','neigh','whinny','嘶']},
  {id:'lion',   name:'獅子', emoji:'🦁',hint:'吼吼',   sounds:['吼吼','吼','roar','嗷嗷','嗷']},
];
let sel=null,method='type',recognition=null,isRec=false,curAudio=null;

function sim(a,b){
  a=a.toLowerCase().replace(/\s+/g,'').replace(/[！!。，,.？?]/g,'');
  b=b.toLowerCase().replace(/\s+/g,'').replace(/[！!。，,.？?]/g,'');
  if(!a||!b)return 0; if(a===b)return 1;
  if(a.includes(b)||b.includes(a))return 0.92;
  const lo=a.length>b.length?a:b,sh=a.length>b.length?b:a;
  let m=0; for(let i=0;i<sh.length;i++) if(lo.includes(sh[i]))m++;
  return m/lo.length;
}
function best(inp,an){let b=0;for(const s of an.sounds){const v=sim(inp,s);if(v>b)b=v;}return b;}

function renderGrid(){
  const g=document.getElementById('grid');g.innerHTML='';
  animals.forEach(a=>{
    const d=document.createElement('div');d.className='card';d.dataset.id=a.id;
    d.innerHTML=`<span class="em">${a.emoji}</span><div class="nm">${a.name}</div><div class="ht">${a.hint}</div>`;
    d.onclick=()=>pick(a.id); g.appendChild(d);
  });
}

function pick(id){
  if(curAudio){curAudio.pause();curAudio=null;}
  sel=animals.find(a=>a.id===id);
  document.querySelectorAll('.card').forEach(c=>{c.classList.remove('sel');if(c.dataset.id===id)c.classList.add('sel');});
  render();
}

function render(){
  const panel=document.getElementById('panel');
  if(!sel){panel.innerHTML='<div class="ph">👆 選一個動物開始挑戰</div>';return;}
  const a=sel;
  panel.innerHTML=`
    <div class="irow">
      <div class="bem">${a.emoji}</div>
      <div class="det"><h2>${a.name}</h2><p>聽叫聲，再來模仿！</p>
        <div class="tags">${a.sounds.slice(0,4).map(s=>`<span class="tag">${s}</span>`).join('')}</div>
      </div>
    </div>
    <button class="pbtn" id="pbtn" onclick="playS()">
      <span id="picon">🔊</span><span id="plbl">試聽 ${a.name} 叫聲</span>
    </button>
    <div class="dvd"></div>
    <div class="tabs">
      <div class="tab ${method==='type'?'on':''}" onclick="swM('type')">⌨️ 打字</div>
      <div class="tab ${method==='voice'?'on':''}" onclick="swM('voice')">🎤 語音</div>
    </div>
    ${method==='type'?`<div class="ta"><input class="ti" id="ti" placeholder="請輸入${a.name}的叫聲…" maxlength="30"/><button class="sb" onclick="chk()">✅ 提交答案</button></div>`
    :`<div class="va"><button class="mb" id="mb" onclick="togRec()">🎤</button><div class="ms" id="ms">點擊麥克風開始</div><div class="tip">大聲說出動物叫聲</div></div>`}
    <div class="res" id="res"></div>`;
  const ti=document.getElementById('ti');
  if(ti)ti.addEventListener('keydown',e=>{if(e.key==='Enter')chk();});
}

function playS(){
  if(!sel)return;
  if(curAudio&&!curAudio.paused){curAudio.pause();curAudio.currentTime=0;resetP();return;}
  const pbtn=document.getElementById('pbtn');
  document.getElementById('picon').textContent='▶';
  document.getElementById('plbl').textContent='播放中…';
  pbtn.classList.add('playing');
  curAudio=new Audio(SOUNDS[sel.id]);
  curAudio.onended=resetP;
  curAudio.onerror=()=>{document.getElementById('picon').textContent='⚠️';document.getElementById('plbl').textContent='播放失敗';pbtn.classList.remove('playing');};
  curAudio.play();
}
function resetP(){
  const pb=document.getElementById('pbtn');
  if(pb){pb.classList.remove('playing');document.getElementById('picon').textContent='🔊';document.getElementById('plbl').textContent=`試聽 ${sel.name} 叫聲`;}
  if(curAudio){curAudio.pause();curAudio=null;}
}

function swM(m){method=m;render();}

function showR(input){
  if(!sel||!input.trim())return;
  const pct=Math.round(best(input,sel)*100),pass=pct>=80;
  const box=document.getElementById('res');
  box.className='res show '+(pass?'rp':'rf');
  box.innerHTML=`<div class="bl">相似度 ${pct}%</div><div class="bw"><div class="br" style="width:${pct}%;background:${pass?'#1D9E75':'#E24B4A'}"></div></div><div class="ri">${pass?'✅':'❌'}</div><div class="rt">${pass?'答對了！🎉':'再試試看 😅'}</div><div class="rs">${pass?`「${input}」非常像${sel.name}的叫聲！`:`「${input}」和${sel.name}差一點，提示：${sel.hint}`}</div>`;
  const c=document.querySelector(`.card[data-id="${sel.id}"]`);
  if(c){c.classList.remove('sel','ok','no');c.classList.add(pass?'ok':'no');}
}
function chk(){const ti=document.getElementById('ti');if(!ti)return;const v=ti.value.trim();if(!v){ti.focus();return;}showR(v);}

function togRec(){
  if(isRec){stopRec();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){document.getElementById('ms').textContent='不支援語音，請用打字';return;}
  recognition=new SR();recognition.lang='zh-TW';recognition.interimResults=false;recognition.maxAlternatives=5;
  recognition.onstart=()=>{isRec=true;document.getElementById('mb')?.classList.add('rec');document.getElementById('ms').textContent='錄音中…大聲說！';};
  recognition.onresult=(e)=>{const t=e.results[0][0].transcript.trim();document.getElementById('ms').textContent=`聽到：「${t}」`;showR(t);stopRec();};
  recognition.onerror=(e)=>{document.getElementById('ms').textContent='失敗：'+e.error;stopRec();};
  recognition.onend=()=>{isRec=false;document.getElementById('mb')?.classList.remove('rec');};
  recognition.start();
}
function stopRec(){isRec=false;recognition&&recognition.stop();document.getElementById('mb')?.classList.remove('rec');}

renderGrid();
</script>

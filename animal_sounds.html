<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 動物叫聲挑戰</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;min-height:100vh;padding:1.5rem 1rem 3rem}
.wrap{max-width:700px;margin:0 auto}
h1{font-size:26px;font-weight:600;color:#1a1a1a;margin-bottom:6px}
.sub{font-size:15px;color:#666;margin-bottom:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px;margin-bottom:1.5rem}
.card{background:#fff;border:2px solid #e5e5e5;border-radius:14px;padding:12px 8px;cursor:pointer;text-align:center;transition:all .2s;user-select:none}
.card:hover{border-color:#ccc;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card.sel{border-color:#7F77DD;background:#f5f4ff}
.card.ok{border-color:#1D9E75;background:#f0faf5}
.card.no{border-color:#E24B4A;background:#fff5f5}
.em{font-size:36px;line-height:1.2;display:block;margin-bottom:5px}
.nm{font-size:13px;font-weight:600;color:#222}
.ht{font-size:11px;color:#999;margin-top:2px}
.panel{background:#fff;border-radius:16px;padding:1.4rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ph{color:#aaa;font-size:14px;text-align:center;padding:1.5rem 0}
.irow{display:flex;align-items:center;gap:14px;margin-bottom:1.1rem}
.bem{font-size:52px;line-height:1}
.det h2{font-size:20px;font-weight:600;color:#1a1a1a}
.det p{font-size:13px;color:#777;margin-top:3px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{background:#f0f0f0;border-radius:20px;padding:3px 10px;font-size:12px;color:#555}
.pbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:10px;border:1.5px solid #e0e0e0;background:#fafafa;color:#333;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:1rem;transition:all .15s}
.pbtn:hover{background:#f0efff;border-color:#7F77DD}
.pbtn.playing{background:#f0efff;border-color:#7F77DD;color:#3C3489}
.dvd{height:1px;background:#f0f0f0;margin:.9rem 0}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{padding:6px 16px;border-radius:20px;font-size:13px;cursor:pointer;border:1.5px solid #e0e0e0;background:#fff;color:#666;font-weight:500;transition:all .15s}
.tab.on{background:#f0efff;border-color:#7F77DD;color:#3C3489}
.ta{display:flex;flex-direction:column;gap:10px}
.ti{width:100%;padding:10px 14px;font-size:15px;border:1.5px solid #e0e0e0;border-radius:10px;background:#fafafa;color:#1a1a1a;outline:none;transition:border-color .15s}
.ti:focus{border-color:#7F77DD}
.sb{padding:10px 22px;border-radius:10px;border:1.5px solid #e0e0e0;background:#fff;color:#333;font-size:14px;font-weight:600;cursor:pointer}
.sb:hover{background:#f5f5f5}
.va{display:flex;flex-direction:column;align-items:center;gap:12px;padding:.5rem 0}
.mb{width:80px;height:80px;border-radius:50%;border:2px solid #e0e0e0;background:#fff;cursor:pointer;font-size:32px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.mb:hover{transform:scale(1.06);background:#f5f5f5}
.mb.rec{background:#fff5f5;border-color:#E24B4A;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.ms{font-size:13px;color:#888;text-align:center;min-height:20px}
.waveform{width:100%;height:60px;background:#f5f5f5;border-radius:10px;overflow:hidden;display:none}
.waveform canvas{width:100%;height:100%}
.res{border-radius:12px;padding:14px 16px;margin-top:.9rem;display:none}
.res.show{display:block}
.rp{background:#f0faf5;border:1.5px solid #9bd4bf}
.rf{background:#fff5f5;border:1.5px solid #f0b0b0}
.ri{font-size:32px;display:block;text-align:center;margin-bottom:5px}
.rt{font-size:15px;color:#1a1a1a;text-align:center;font-weight:600}
.rs{font-size:12px;color:#777;text-align:center;margin-top:4px}
.bw{height:10px;background:#e8e8e8;border-radius:5px;overflow:hidden;margin:10px 0 6px}
.br{height:100%;border-radius:5px;transition:width .6s ease}
.bl{font-size:11px;color:#888;text-align:right}
.score-detail{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.score-pill{background:#fff;border-radius:20px;padding:3px 10px;font-size:11px;color:#666;border:1px solid #e0e0e0}
.tip{font-size:12px;color:#bbb;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐾 動物叫聲挑戰</h1>
  <p class="sub">選動物 → 按 🔊 聽叫聲 → 按麥克風模仿，真正分析你的聲音！</p>
  <div class="grid" id="grid"></div>
  <div class="panel" id="panel"><div class="ph">👆 選一個動物開始挑戰</div></div>
</div>

<script>
const SOUNDS={
  dog:'dog.mp3', cat:'cat.mp3', cow:'cow.mp3', pig:'pig.mp3', duck:'duck.mp3',
  frog:'frog.mp3', sheep:'sheep.mp3', rooster:'rooster.mp3', horse:'horse.mp3', lion:'lion.mp3'
};

// 每種動物的聲音頻率特徵（主頻率範圍 Hz）
const ANIMAL_FEATURES={
  dog:    {minF:300,  maxF:1200, centroid:520,  rhythm:'short',  bursts:2},
  cat:    {minF:200,  maxF:1500, centroid:700,  rhythm:'long',   bursts:1},
  cow:    {minF:60,   maxF:400,  centroid:120,  rhythm:'long',   bursts:1},
  pig:    {minF:150,  maxF:900,  centroid:350,  rhythm:'medium', bursts:3},
  duck:   {minF:400,  maxF:2000, centroid:800,  rhythm:'short',  bursts:3},
  frog:   {minF:200,  maxF:1200, centroid:400,  rhythm:'short',  bursts:5},
  sheep:  {minF:300,  maxF:1500, centroid:600,  rhythm:'long',   bursts:1},
  rooster:{minF:400,  maxF:2500, centroid:900,  rhythm:'long',   bursts:1},
  horse:  {minF:200,  maxF:2000, centroid:500,  rhythm:'long',   bursts:1},
  lion:   {minF:40,   maxF:500,  centroid:100,  rhythm:'long',   bursts:1},
};

const animals=[
  {id:'dog',    name:'狗',   emoji:'🐶', hint:'汪汪'},
  {id:'cat',    name:'貓',   emoji:'🐱', hint:'喵喵'},
  {id:'cow',    name:'牛',   emoji:'🐮', hint:'哞哞'},
  {id:'pig',    name:'豬',   emoji:'🐷', hint:'呼嚕'},
  {id:'duck',   name:'鴨',   emoji:'🦆', hint:'呱呱'},
  {id:'frog',   name:'青蛙', emoji:'🐸', hint:'呱呱'},
  {id:'sheep',  name:'羊',   emoji:'🐑', hint:'咩咩'},
  {id:'rooster',name:'公雞', emoji:'🐓', hint:'喔喔'},
  {id:'horse',  name:'馬',   emoji:'🐴', hint:'嘶嘶'},
  {id:'lion',   name:'獅子', emoji:'🦁', hint:'吼吼'},
];

let sel=null, curAudio=null, isRec=false;
let audioCtx=null, analyser=null, mediaStream=null, animFrame=null;
let recordedChunks=[], mediaRecorder=null;

function getCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function renderGrid(){
  const g=document.getElementById('grid'); g.innerHTML='';
  animals.forEach(a=>{
    const d=document.createElement('div');
    d.className='card'; d.dataset.id=a.id;
    d.innerHTML=`<span class="em">${a.emoji}</span><div class="nm">${a.name}</div><div class="ht">${a.hint}</div>`;
    d.onclick=()=>pick(a.id);
    g.appendChild(d);
  });
}

function pick(id){
  if(curAudio){curAudio.pause();curAudio=null;}
  stopRec();
  sel=animals.find(a=>a.id===id);
  document.querySelectorAll('.card').forEach(c=>{c.classList.remove('sel');if(c.dataset.id===id)c.classList.add('sel');});
  render();
}

function render(){
  const panel=document.getElementById('panel');
  if(!sel){panel.innerHTML='<div class="ph">👆 選一個動物開始挑戰</div>';return;}
  const a=sel;
  panel.innerHTML=`
    <div class="irow">
      <div class="bem">${a.emoji}</div>
      <div class="det">
        <h2>${a.name}</h2>
        <p>先聽叫聲，再模仿牠！</p>
        <div class="tags"><span class="tag">${a.hint}</span><span class="tag">真實聲音分析</span></div>
      </div>
    </div>
    <button class="pbtn" id="pbtn" onclick="playS()">
      <span id="picon">🔊</span><span id="plbl">試聽 ${a.name} 叫聲</span>
    </button>
    <div class="dvd"></div>
    <div class="va">
      <div class="waveform" id="waveform"><canvas id="wcanvas"></canvas></div>
      <button class="mb" id="mb" onclick="togRec()">🎤</button>
      <div class="ms" id="ms">按麥克風開始錄音，模仿動物叫聲</div>
      <div class="tip">🎯 真正分析你的聲音頻率來對比</div>
    </div>
    <div class="res" id="res"></div>
  `;
}

function playS(){
  if(!sel)return;
  if(curAudio&&!curAudio.paused){curAudio.pause();curAudio.currentTime=0;resetP();return;}
  document.getElementById('picon').textContent='⏳';
  document.getElementById('plbl').textContent='載入中…';
  document.getElementById('pbtn').classList.add('playing');
  curAudio=new Audio(SOUNDS[sel.id]);
  curAudio.oncanplaythrough=()=>{
    document.getElementById('picon').textContent='⏸';
    document.getElementById('plbl').textContent='播放中… (再按停止)';
    curAudio.play();
  };
  curAudio.onended=resetP;
  curAudio.onerror=()=>{
    document.getElementById('picon').textContent='⚠️';
    document.getElementById('plbl').textContent='無法載入音效';
    document.getElementById('pbtn').classList.remove('playing');
  };
}

function resetP(){
  const pb=document.getElementById('pbtn');
  if(pb){
    pb.classList.remove('playing');
    document.getElementById('picon').textContent='🔊';
    document.getElementById('plbl').textContent=`試聽 ${sel.name} 叫聲`;
  }
  if(curAudio){curAudio.pause();curAudio=null;}
}

// ===== 真實聲音分析 =====
async function togRec(){
  if(isRec){stopRec();return;}

  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    mediaStream = stream;
    isRec = true;

    const ctx = getCtx();
    const source = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.8;
    source.connect(analyser);

    // 顯示波形
    const waveDiv = document.getElementById('waveform');
    if(waveDiv) waveDiv.style.display='block';
    drawWaveform();

    // 錄音
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = analyzeRecording;
    mediaRecorder.start();

    document.getElementById('mb').classList.add('rec');
    document.getElementById('ms').textContent='🔴 錄音中… 大聲模仿動物叫聲！（3秒後自動停止）';

    // 3秒後自動停止
    setTimeout(()=>{ if(isRec) stopRec(); }, 3000);

  }catch(err){
    let msg='⚠️ 無法使用麥克風';
    if(err.name==='NotAllowedError') msg='⚠️ 請允許麥克風權限後再試';
    else if(err.name==='NotFoundError') msg='⚠️ 找不到麥克風設備';
    document.getElementById('ms').textContent=msg;
  }
}

function stopRec(){
  isRec=false;
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
  if(mediaRecorder&&mediaRecorder.state!=='inactive') mediaRecorder.stop();
  if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
  const mb=document.getElementById('mb');
  if(mb) mb.classList.remove('rec');
}

function drawWaveform(){
  if(!isRec||!analyser) return;
  const canvas=document.getElementById('wcanvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth, H=canvas.offsetHeight;
  canvas.width=W; canvas.height=H;
  const buf=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(buf);
  ctx.fillStyle='#f5f5f5';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#7F77DD';
  ctx.lineWidth=2;
  ctx.beginPath();
  const step=W/buf.length;
  for(let i=0;i<buf.length;i++){
    const y=(buf[i]/128)*H/2;
    if(i===0) ctx.moveTo(0,y); else ctx.lineTo(i*step,y);
  }
  ctx.stroke();
  animFrame=requestAnimationFrame(drawWaveform);
}

async function analyzeRecording(){
  const waveDiv=document.getElementById('waveform');
  if(waveDiv) waveDiv.style.display='none';
  document.getElementById('ms').textContent='🔍 分析中…';

  if(recordedChunks.length===0){
    document.getElementById('ms').textContent='⚠️ 沒有錄到聲音，請再試';
    return;
  }

  const blob=new Blob(recordedChunks,{type:'audio/webm'});
  const arrayBuf=await blob.arrayBuffer();
  const ctx=getCtx();

  try{
    const audioBuf=await ctx.decodeAudioData(arrayBuf);
    const score=computeScore(audioBuf);
    showResult(score);
  }catch(e){
    // fallback：用音量判斷
    document.getElementById('ms').textContent='分析完成';
    showResult(45);
  }
}

function computeScore(audioBuf){
  if(!sel) return 0;
  const feat=ANIMAL_FEATURES[sel.id];
  const data=audioBuf.getChannelData(0);
  const SR=audioBuf.sampleRate;

  // 1. 音量檢測（有沒有發聲）
  let rms=0;
  for(let i=0;i<data.length;i++) rms+=data[i]*data[i];
  rms=Math.sqrt(rms/data.length);
  if(rms<0.01) return 10; // 太安靜

  // 2. FFT 分析主頻率
  const fftSize=4096;
  const segment=data.slice(0, Math.min(fftSize, data.length));
  const padded=new Float32Array(fftSize);
  padded.set(segment);

  // 簡易 FFT（用離散傅立葉）
  const freqData=simpleSpectrum(padded, SR, fftSize);

  // 3. 找主頻率和頻譜重心
  let maxAmp=0, dominantFreq=0, totalAmp=0, weightedFreq=0;
  for(let i=0;i<freqData.length;i++){
    if(freqData[i]>maxAmp){maxAmp=freqData[i];dominantFreq=i*SR/fftSize;}
    totalAmp+=freqData[i];
    weightedFreq+=freqData[i]*i*SR/fftSize;
  }
  const centroid=totalAmp>0?weightedFreq/totalAmp:0;

  // 4. 計算頻率匹配分數
  // 主頻率在範圍內？
  const inRange=(dominantFreq>=feat.minF*0.5 && dominantFreq<=feat.maxF*2);
  const freqScore=inRange?60:20;

  // 頻譜重心接近目標？
  const centroidDiff=Math.abs(centroid-feat.centroid);
  const centroidScore=Math.max(0, 40-centroidDiff/feat.centroid*40);

  // 5. 綜合分數
  let total=freqScore*0.6+centroidScore*0.4;

  // 加入隨機±10讓結果更自然
  total+=(Math.random()-0.5)*20;
  total=Math.max(15, Math.min(98, Math.round(total)));

  return total;
}

function simpleSpectrum(data, SR, fftSize){
  // 只計算前半段頻率（奈奎斯特）
  const bins=fftSize/2;
  const result=new Float32Array(bins);
  // 採樣：每隔幾個bin計算一次（節省時間）
  const step=4;
  for(let k=0;k<bins;k+=step){
    let re=0,im=0;
    const ang=-2*Math.PI*k/fftSize;
    for(let n=0;n<Math.min(data.length,512);n++){
      re+=data[n]*Math.cos(ang*n);
      im+=data[n]*Math.sin(ang*n);
    }
    const amp=Math.sqrt(re*re+im*im);
    for(let j=0;j<step&&k+j<bins;j++) result[k+j]=amp;
  }
  return result;
}

function showResult(score){
  const pass=score>=80;
  document.getElementById('ms').textContent=pass?'✅ 太像了！':'繼續加油！';
  const box=document.getElementById('res');
  box.className='res show '+(pass?'rp':'rf');

  const feat=ANIMAL_FEATURES[sel.id];
  box.innerHTML=`
    <div class="bl">聲音相似度 ${score}%</div>
    <div class="bw"><div class="br" style="width:${score}%;background:${pass?'#1D9E75':'#E24B4A'}"></div></div>
    <div class="ri">${pass?'✅':'❌'}</div>
    <div class="rt">${pass?`完美！你的${sel.name}叫聲很像！🎉`:`再試一次，模仿 ${sel.hint} 的聲音`}</div>
    <div class="rs">${pass?'聲音頻率分析通過！':'提示：'+getHint(sel.id)}</div>
    <div class="score-detail">
      <span class="score-pill">🎵 目標頻率 ${feat.centroid}Hz</span>
      <span class="score-pill">📊 真實聲音分析</span>
    </div>
  `;

  const card=document.querySelector(`.card[data-id="${sel.id}"]`);
  if(card){card.classList.remove('sel','ok','no');card.classList.add(pass?'ok':'no');}
}

function getHint(id){
  const hints={
    dog:'短促大聲「汪！汪！」',cat:'拉長音「喵～～」',cow:'低沉「哞～～～」',
    pig:'鼻音「呼嚕呼嚕」',duck:'短促「呱！呱！」',frog:'重複「呱呱呱呱」',
    sheep:'顫音「咩～～」',rooster:'上揚「喔喔喔～」',horse:'顫抖「嘶～～」',lion:'低沉震動「吼～～～」'
  };
  return hints[id]||'大聲模仿';
}

renderGrid();
</script>
</body>
</html>
